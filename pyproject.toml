[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "spire-hdl"
version = "0.2.0"
description = "Spire HDL is a hardware description language for digital circuits."
authors = [{ name = "Felix Arnold", email = "felix.arnold@h-partners.com" }]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dynamic = [
    "dependencies"
]

# Data files matching .gitignore patterns (*.aig, *.map, *.csv) are excluded by hatchling
# unless listed as artifacts; a plain `include` cannot override the VCS-based exclusion.
[tool.hatch.build]
artifacts = [
    "src/spire/arithmetic/int_multipliers/data/**",
    "src/spire/arithmetic/eval/*.json",
    "src/spire/arithmetic/eval/*.csv",
]

# Tell hatchling what to put into the wheel
[tool.hatch.build.targets.wheel]
packages = ["src/spire"]

# The sdist must keep the src/ layout (no path rewriting), otherwise building the
# wheel from the sdist finds no "src/spire" package and produces an empty wheel.
[tool.hatch.build.targets.sdist]
only-include = ["src/spire"]

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.ruff]
line-length = 120
